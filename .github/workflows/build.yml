name: build

on:
  push:
    branches:
      - main
      - beta
  pull_request:
  merge_group:
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !endsWith(github.ref_name, 'main') && !endsWith(github.ref_name, 'beta') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: "☕ Setup JDK"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          cache: gradle
          cache-dependency-path: |
            versions/dependencies/*.properties
            *.properties
            *.gradle.kts
          java-version: |
            25
          check-latest: true
          distribution: temurin

      - name: "🛂 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: "🔓 Adjust script permissions"
        run: chmod +x ./gradlew


      - name: "🧪 Run Dev Build"

        run: ./gradlew buildAndCollect --stacktrace


      - name: "🕵️‍♂️ Collect artifacts"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Artifacts
          path: |
            build/libs/*.jar
            build/reports/**/*
            versions/*/build/reports/**/*
