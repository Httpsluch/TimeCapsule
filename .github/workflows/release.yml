name: release

# Run by hand from the Actions tab: builds all jars, uploads them to Modrinth and CurseForge,
# and attaches them to a GitHub release tagged v<mod.version>.
#
# Repository settings it needs (Settings > Secrets and variables > Actions):
#   Variables: MODRINTH_ID, CURSEFORGE_ID
#   Secrets:   MODRINTH_TOKEN, CURSEFORGE_TOKEN
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release channel shown on Modrinth and CurseForge"
        type: choice
        options: [stable, beta, alpha]
        default: stable

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODRINTH_ID: ${{ vars.MODRINTH_ID }}
      CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
      CURSEFORGE_SLUG: sealed-time-capsule
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔎 Check release settings"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=""
          for name in MODRINTH_ID CURSEFORGE_ID MODRINTH_TOKEN CURSEFORGE_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing. Project IDs are Actions variables; tokens are Actions secrets."
            exit 1
          fi
          version=$(grep '^mod.version=' gradle.properties | cut -d= -f2)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already released. Bump mod.version in gradle.properties and update CHANGELOG.md first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: "☕ Setup JDK"
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: "🛂 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: "🔓 Adjust script permissions"
        run: chmod +x ./gradlew

      - name: "🚀 Build and publish every jar"
        env:
          DO_PUBLISH: "true"
          RELEASE_TYPE: ${{ inputs.release_type }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew chiseledPublishMods --stacktrace

      - name: "📦 Collect jars"
        run: ./gradlew chiseledBuildAndCollect

      - name: "🏷️ Create GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t jars < <(find build/libs -name "*.jar" ! -name "*-sources.jar" | sort)
          gh release create "v$VERSION" "${jars[@]}" \
            --title "Time Capsule $VERSION" \
            --notes-file CHANGELOG.md \
            --target "$GITHUB_SHA"
